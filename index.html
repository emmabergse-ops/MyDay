<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mina uppgifter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#F5F7F5;
  --text:#1C2420; --text-muted:#5B6864; --border:#D8DED9;
  --accent:#2F6F62; --accent-ink:#FFFFFF; --accent-2:#C98A2C;
  --danger:#B3462C; --focus:#2F6F62;
  --font-head:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1B231F; --surface-2:#202A25;
    --text:#E8EDE9; --text-muted:#9AA79F; --border:#2A332E;
    --accent:#59B39E; --accent-ink:#0E1512; --accent-2:#E0A94A;
    --danger:#E08769; --focus:#59B39E;
  }
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select{ font-family:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.wrap{ max-width:640px; margin:0 auto; padding:20px 18px 64px; }
.top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
.top h1{ font-family:var(--font-head); font-size:1.35rem; font-weight:700; margin:0; letter-spacing:-0.01em; }
.top .range{ font-size:0.85rem; color:var(--text-muted); }
.tabs{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); }
.tab{ background:none; border:none; padding:9px 4px; margin-right:12px; font-size:0.92rem; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; position:relative; top:1px; }
.tab[aria-selected="true"]{ color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
.days{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px; scrollbar-width:none; }
.days::-webkit-scrollbar{ display:none; }
.daypill{ flex:0 0 auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 13px; cursor:pointer; text-align:center; min-width:58px; }
.daypill .wd{ display:block; font-size:0.72rem; color:var(--text-muted); font-weight:500; }
.daypill .num{ display:block; font-family:var(--font-head); font-size:1.05rem; font-weight:600; margin-top:1px; }
.daypill[data-active="true"]{ border-color:var(--accent); background:var(--surface-2); }
.daypill[data-active="true"] .wd{ color:var(--accent); }
.daypill .dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent-2); margin-top:4px; visibility:hidden; }
.daypill[data-pending="true"] .dot{ visibility:visible; }
.section-heading{ font-family:var(--font-head); font-size:1.05rem; font-weight:600; margin:0 0 10px; }
.tasklist{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:8px; }
.task{ display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; }
.task input[type="checkbox"]{ width:19px; height:19px; margin-top:1px; accent-color:var(--accent); flex:0 0 auto; cursor:pointer; }
.task .body{ flex:1 1 auto; min-width:0; }
.task .title{ font-size:0.96rem; line-height:1.35; word-break:break-word; }
.task.done .title{ color:var(--text-muted); text-decoration:line-through; }
.task .meta{ margin-top:3px; font-size:0.74rem; color:var(--text-muted); }
.task .meta .tag{ display:inline-block; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:1px 6px; margin-right:6px; }
.task .del{ background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; font-size:1rem; line-height:1; flex:0 0 auto; }
.task .del:hover{ color:var(--danger); }
.task .edit, .upcoming-row .edit{ background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; font-size:1rem; line-height:1; flex:0 0 auto; }
.task .edit:hover, .upcoming-row .edit:hover{ color:var(--accent); }
.rowbtns{ display:flex; align-items:center; flex:0 0 auto; }
.task.editing{ display:block; padding:0; border:none; background:none; }
.empty{ color:var(--text-muted); font-size:0.9rem; padding:14px 2px 20px; }
.upcoming-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px; }
.upcoming-row .title{ font-size:0.94rem; }
.upcoming-row .date{ font-size:0.78rem; color:var(--text-muted); white-space:nowrap; }
.upcoming-row .del{ background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1rem; }
.upcoming-row .del:hover{ color:var(--danger); }
.addtoggle{ width:100%; text-align:left; background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:12px 14px; color:var(--text-muted); cursor:pointer; font-size:0.92rem; }
.addtoggle:hover{ border-color:var(--accent); color:var(--text); }
.addform{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.addform label{ font-size:0.78rem; color:var(--text-muted); display:block; margin-bottom:4px; }
.addform input[type="text"], .addform input[type="date"], .addform select{ width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); font-size:0.94rem; }
.addform .row{ display:flex; gap:10px; }
.addform .row > div{ flex:1; }
.addform .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:2px; }
.btn{ border:none; border-radius:8px; padding:9px 15px; font-size:0.9rem; font-weight:600; cursor:pointer; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); }
.btn.ghost{ background:none; color:var(--text-muted); }
.btn.ghost:hover{ color:var(--text); }
.hint{ font-size:0.78rem; color:var(--text-muted); margin-top:2px; }
.setup{ max-width:520px; margin:60px auto; padding:0 20px; font-size:0.95rem; line-height:1.5; }
.setup code{ background:var(--surface-2); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // ---- FYLL I DINA EGNA VÄRDEN HÄR (Supabase -> Settings -> API) ----
  var SUPABASE_URL = "https://votociadjewygpephlrt.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_hqLqpZkpNBxmULBwtE3I-A_4FHIspMn";
  // ---------------------------------------------------------------

  var app = document.getElementById('app');

  if (SUPABASE_URL.indexOf('DITT-PROJEKT') !== -1 || SUPABASE_ANON_KEY.indexOf('DIN-ANON-KEY') !== -1) {
    app.innerHTML = '<div class="setup"><h2>Nästan klart</h2><p>Öppna den här filen och ersätt <code>SUPABASE_URL</code> och <code>SUPABASE_ANON_KEY</code> högst upp i skriptet med värdena från ditt Supabase-projekt (Settings &rarr; API).</p></div>';
    return;
  }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var state = { tasks: [], doneMap: {}, birthdays: [], birthdayDoneMap: {} };
  var view = 'vecka';
  var addOpen = false;
  var bAddOpen = false;
  var editing = null; // { kind:'task'|'birthday', id:... }
  var currentUser = null;

  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fromISO(iso){ var p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function todayISO(){ return toISO(new Date()); }
  function addDays(iso, n){ var d = fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function isWeekdayISO(iso){ var day = fromISO(iso).getDay(); return day >= 1 && day <= 5; }
  function cmpISO(a,b){ return a < b ? -1 : (a > b ? 1 : 0); }
  function daysBetween(aIso, bIso){ return Math.round((fromISO(bIso) - fromISO(aIso)) / 86400000); }
  var INTERVALS = { every2: 2, every3: 3 };

  var WINDOW_LEN = 7;
  var weekDates = (function(){ var t = todayISO(), arr = []; for (var i=0;i<WINDOW_LEN;i++) arr.push(addDays(t,i)); return arr; })();
  var lastWindowDate = weekDates[weekDates.length - 1];
  var selectedDate = weekDates[0];

  function recurrenceLabel(r){
    if (r === 'daily') return 'Varje dag';
    if (r === 'weekday') return 'Varje vardag';
    if (r === 'every2') return 'Varannan dag';
    if (r === 'every3') return 'Var tredje dag';
    return 'En gång';
  }

  function tasksForDate(iso){
    return state.tasks.filter(function(t){
      if (t.recurrence === 'daily') return true;
      if (t.recurrence === 'weekday') return isWeekdayISO(iso);
      if (INTERVALS[t.recurrence]){
        if (!t.date) return false;
        var diff = daysBetween(t.date, iso);
        return diff >= 0 && diff % INTERVALS[t.recurrence] === 0;
      }
      return t.date === iso;
    });
  }

  function isLeap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function occurrenceInYear(b, y){
    var d = b.day;
    if (b.month === 2 && d === 29 && !isLeap(y)) d = 28;
    return y + '-' + pad(b.month) + '-' + pad(d);
  }
  function nextOccurrence(b){
    var t = todayISO(), y = Number(t.slice(0,4));
    var o = occurrenceInYear(b, y);
    if (o < t) o = occurrenceInYear(b, y + 1);
    return o;
  }
  function birthdaysForDate(iso){
    var y = Number(iso.slice(0,4));
    return state.birthdays.filter(function(b){ return occurrenceInYear(b, y) === iso; });
  }

  function isDone(taskId, iso){ return !!state.doneMap[taskId + '|' + iso]; }
  function isBirthdayDone(id, iso){ return !!state.birthdayDoneMap[id + '|' + iso]; }
  function pendingCountForDate(iso){
    var list = tasksForDate(iso), n = 0;
    for (var i=0;i<list.length;i++) if (!isDone(list[i].id, iso)) n++;
    return n;
  }
  function upcomingBacklog(){
    return state.tasks.filter(function(t){ return t.recurrence === 'once' && t.date > lastWindowDate; })
      .sort(function(a,b){ return cmpISO(a.date, b.date); });
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag); attrs = attrs || {};
    for (var k in attrs){
      if (k === 'text') e.textContent = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }

  // Senaste förfallodag (<= idag) för en intervall-uppgift (t.ex. var tredje dag).
  function lastDueDateOnOrBefore(t, today){
    if (!t.date) return null;
    var diff = daysBetween(t.date, today);
    if (diff < 0) return null;
    var interval = INTERVALS[t.recurrence];
    var mod = diff % interval;
    return addDays(today, -mod);
  }

  // Uppgiftstyper som ska flyttas fram om de inte bockas av (utöver "En gång").
  // "Varje dag"/"Varje vardag" flyttas INTE -- de kan bara försvinna om de missas.
  var ROLLOVER_INTERVALS = { every3: true };

  async function rolloverOverdueTasks(){
    var today = todayISO();
    var toBump = [];
    state.tasks.forEach(function(t){
      if (t.recurrence === 'once'){
        if (t.date && t.date < today && !isDone(t.id, t.date)) toBump.push(t);
        return;
      }
      if (ROLLOVER_INTERVALS[t.recurrence]){
        var lastDue = lastDueDateOnOrBefore(t, today);
        if (lastDue && lastDue < today && !isDone(t.id, lastDue)) toBump.push(t);
      }
    });
    for (var i = 0; i < toBump.length; i++){
      var t = toBump[i];
      var res = await sb.from('tasks').update({ date: today }).eq('id', t.id);
      if (!res.error) t.date = today;
    }
  }

  async function loadState(){
    var t = await sb.from('tasks').select('*').order('created_at');
    var c = await sb.from('completions').select('*');
    var bd = await sb.from('birthdays').select('*').order('created_at');
    var bc = await sb.from('birthday_completions').select('*');
    if (t.error || c.error || bd.error || bc.error){
      app.innerHTML = '<div class="setup"><h2>Kunde inte hämta data</h2><p>' + ((t.error && t.error.message) || (c.error && c.error.message) || (bd.error && bd.error.message) || (bc.error && bc.error.message)) + '</p></div>';
      return;
    }
    state.birthdays = bd.data.map(function(x){ return { id:x.id, name:x.name, month:x.month, day:x.day, year:x.birth_year }; });
    state.birthdayDoneMap = {};
    bc.data.forEach(function(row){ state.birthdayDoneMap[row.birthday_id + '|' + row.date] = true; });
    state.tasks = t.data.map(function(x){ return { id:x.id, title:x.title, recurrence:x.recurrence, date:x.date }; });
    state.doneMap = {};
    c.data.forEach(function(row){ state.doneMap[row.task_id + '|' + row.date] = true; });
    await rolloverOverdueTasks();
    render();
  }

  async function addTask(title, recurrence, date){
    var res = await sb.from('tasks').insert({ title:title, recurrence:recurrence, date:date }).select().single();
    if (res.error){ alert('Kunde inte lägga till uppgiften: ' + res.error.message); return; }
    state.tasks.push({ id:res.data.id, title:res.data.title, recurrence:res.data.recurrence, date:res.data.date });
    addOpen = false;
    render();
  }

  async function addBirthday(name, day, month, year){
    var res = await sb.from('birthdays').insert({ name:name, day:day, month:month, birth_year:year }).select().single();
    if (res.error){ alert('Kunde inte spara födelsedagen: ' + res.error.message); return; }
    state.birthdays.push({ id:res.data.id, name:res.data.name, month:res.data.month, day:res.data.day, year:res.data.birth_year });
    bAddOpen = false;
    render();
  }

  async function updateTask(id, title, recurrence, date){
    var res = await sb.from('tasks').update({ title:title, recurrence:recurrence, date:date }).eq('id', id);
    if (res.error){ alert('Kunde inte spara ändringen: ' + res.error.message); return; }
    state.tasks.forEach(function(t){
      if (t.id === id){ t.title = title; t.recurrence = recurrence; t.date = date; }
    });
    editing = null;
    render();
  }

  async function updateBirthday(id, name, day, month, year){
    var res = await sb.from('birthdays').update({ name:name, day:day, month:month, birth_year:year }).eq('id', id);
    if (res.error){ alert('Kunde inte spara ändringen: ' + res.error.message); return; }
    state.birthdays.forEach(function(b){
      if (b.id === id){ b.name = name; b.day = day; b.month = month; b.year = year; }
    });
    editing = null;
    render();
  }

  async function deleteBirthday(id){
    var res = await sb.from('birthdays').delete().eq('id', id);
    if (res.error){ alert('Kunde inte ta bort: ' + res.error.message); return; }
    state.birthdays = state.birthdays.filter(function(b){ return b.id !== id; });
    Object.keys(state.birthdayDoneMap).forEach(function(k){ if (k.indexOf(id + '|') === 0) delete state.birthdayDoneMap[k]; });
    render();
  }

  async function toggleBirthday(id, iso){
    var key = id + '|' + iso;
    if (state.birthdayDoneMap[key]){
      var res = await sb.from('birthday_completions').delete().eq('birthday_id', id).eq('date', iso);
      if (res.error){ alert('Kunde inte spara: ' + res.error.message); return; }
      delete state.birthdayDoneMap[key];
    } else {
      var res2 = await sb.from('birthday_completions').insert({ birthday_id:id, date:iso });
      if (res2.error){ alert('Kunde inte spara: ' + res2.error.message); return; }
      state.birthdayDoneMap[key] = true;
    }
    render();
  }

  async function deleteTask(id){
    var res = await sb.from('tasks').delete().eq('id', id);
    if (res.error){ alert('Kunde inte ta bort uppgiften: ' + res.error.message); return; }
    state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
    Object.keys(state.doneMap).forEach(function(k){ if (k.indexOf(id + '|') === 0) delete state.doneMap[k]; });
    render();
  }

  async function toggleTask(id, iso){
    var key = id + '|' + iso;
    if (state.doneMap[key]){
      var res = await sb.from('completions').delete().eq('task_id', id).eq('date', iso);
      if (res.error){ alert('Kunde inte spara: ' + res.error.message); return; }
      delete state.doneMap[key];
    } else {
      var res2 = await sb.from('completions').insert({ task_id:id, date:iso });
      if (res2.error){ alert('Kunde inte spara: ' + res2.error.message); return; }
      state.doneMap[key] = true;
    }
    render();
  }

  function renderDayPills(container){
    var row = el('div', { class:'days', role:'tablist' });
    weekDates.forEach(function(iso){
      var d = fromISO(iso), isToday = iso === todayISO();
      var wd = isToday ? 'Idag' : d.toLocaleDateString('sv-SE', { weekday:'short' }).replace(/^./, function(c){ return c.toUpperCase(); });
      var pill = el('button', {
        class:'daypill', role:'tab', 'data-active': String(iso === selectedDate),
        'data-pending': String(pendingCountForDate(iso) > 0 || birthdaysForDate(iso).length > 0), 'aria-selected': String(iso === selectedDate),
        onclick: function(){ selectedDate = iso; editing = null; render(); }
      }, [ el('span',{class:'wd',text:wd}), el('span',{class:'num',text:String(d.getDate())}), el('span',{class:'dot'}) ]);
      row.appendChild(pill);
    });
    container.appendChild(row);
  }

  function isEditing(kind, id){ return !!editing && editing.kind === kind && editing.id === id; }

  function renderTaskEditForm(t){
    var titleInput = el('input', { type:'text', maxlength:'140' });
    titleInput.value = t.title;
    var recSelect = el('select', {}, [
      el('option', { value:'once', text:'En gång' }),
      el('option', { value:'daily', text:'Varje dag' }),
      el('option', { value:'weekday', text:'Varje vardag' }),
      el('option', { value:'every2', text:'Varannan dag' }),
      el('option', { value:'every3', text:'Var tredje dag' })
    ]);
    recSelect.value = t.recurrence;
    var dateInput = el('input', { type:'date' });
    dateInput.value = t.date || todayISO();
    var dateLabel = el('label', { text:'Datum' });
    var dateWrap = el('div', {}, [ dateLabel, dateInput ]);
    function syncDateVisibility(){
      var needsDate = recSelect.value === 'once' || !!INTERVALS[recSelect.value];
      dateWrap.style.display = needsDate ? '' : 'none';
      dateLabel.textContent = recSelect.value === 'once' ? 'Datum' : 'Startdatum';
    }
    recSelect.addEventListener('change', syncDateVisibility); syncDateVisibility();
    return el('div', { class:'addform' }, [
      el('div', {}, [ el('label', { text:'Uppgift' }), titleInput ]),
      el('div', { class:'row' }, [ el('div', {}, [ el('label', { text:'Upprepning' }), recSelect ]), dateWrap ]),
      el('div', { class:'hint', text:'Ändringarna gäller hela uppgiften, inte bara den här dagen.' }),
      el('div', { class:'actions' }, [
        el('button', { class:'btn ghost', onclick:function(){ editing = null; render(); } }, [document.createTextNode('Avbryt')]),
        el('button', { class:'btn primary', onclick:function(){
          var title = titleInput.value.trim();
          if (!title){ titleInput.focus(); return; }
          var rec = recSelect.value;
          var date = (rec === 'once' || INTERVALS[rec]) ? (dateInput.value || todayISO()) : null;
          updateTask(t.id, title, rec, date);
        } }, [document.createTextNode('Spara')])
      ])
    ]);
  }

  function renderBirthdayEditForm(b){
    var nameInput = el('input', { type:'text', maxlength:'80' });
    nameInput.value = b.name;
    var dayInput = el('input', { type:'number', min:'1', max:'31' });
    dayInput.value = String(b.day);
    var monthSel = el('select', {}, MONTHS.map(function(m, i){ return el('option', { value:String(i+1), text:m }); }));
    monthSel.value = String(b.month);
    var yearInput = el('input', { type:'number', min:'1900', max:'2100', placeholder:'t.ex. 1990' });
    yearInput.value = b.year ? String(b.year) : '';
    return el('div', { class:'addform' }, [
      el('div', {}, [ el('label', { text:'Namn' }), nameInput ]),
      el('div', { class:'row' }, [
        el('div', {}, [ el('label', { text:'Dag' }), dayInput ]),
        el('div', {}, [ el('label', { text:'Månad' }), monthSel ])
      ]),
      el('div', {}, [ el('label', { text:'Födelseår (valfritt, för att visa ålder)' }), yearInput ]),
      el('div', { class:'actions' }, [
        el('button', { class:'btn ghost', onclick:function(){ editing = null; render(); } }, [document.createTextNode('Avbryt')]),
        el('button', { class:'btn primary', onclick:function(){
          var name = nameInput.value.trim();
          var day = parseInt(dayInput.value, 10);
          var month = parseInt(monthSel.value, 10);
          var year = yearInput.value ? parseInt(yearInput.value, 10) : null;
          if (!name){ nameInput.focus(); return; }
          if (!day || day < 1 || day > 31){ dayInput.focus(); return; }
          updateBirthday(b.id, name, day, month, year);
        } }, [document.createTextNode('Spara')])
      ])
    ]);
  }

  function editButton(kind, id){
    return el('button', { class:'edit', 'aria-label':'Ändra', title:'Ändra', onclick:function(){
      editing = { kind:kind, id:id }; render();
    } }, [document.createTextNode('✎')]);
  }

  function renderTaskRow(t, iso){
    if (isEditing('task', t.id)) return el('li', { class:'task editing' }, [ renderTaskEditForm(t) ]);
    var done = isDone(t.id, iso);
    var cb = el('input', { type:'checkbox', onchange:function(){ toggleTask(t.id, iso); } });
    cb.checked = done;
    var del = el('button', { class:'del', 'aria-label':'Ta bort uppgift', title:'Ta bort', onclick:function(){ deleteTask(t.id); } }, [document.createTextNode('✕')]);
    return el('li', { class:'task' + (done ? ' done' : '') }, [
      cb,
      el('div', { class:'body' }, [ el('div',{class:'title',text:t.title}), el('div',{class:'meta'},[el('span',{class:'tag',text:recurrenceLabel(t.recurrence)})]) ]),
      el('div', { class:'rowbtns' }, [ editButton('task', t.id), del ])
    ]);
  }

  function renderBirthdayRow(b, iso){
    if (isEditing('birthday', b.id)) return el('li', { class:'task editing' }, [ renderBirthdayEditForm(b) ]);
    var done = isBirthdayDone(b.id, iso);
    var age = b.year ? Number(iso.slice(0,4)) - b.year : null;
    var text = (age !== null ? (b.name + ' fyller ' + age + ' år') : (b.name + ' har födelsedag')) + ' 🎂';
    var cb = el('input', { type:'checkbox', onchange:function(){ toggleBirthday(b.id, iso); } });
    cb.checked = done;
    return el('li', { class:'task' + (done ? ' done' : '') }, [
      cb,
      el('div', { class:'body' }, [
        el('div', { class:'title', text:text }),
        el('div', { class:'meta' }, [ el('span', { class:'tag', text:'Födelsedag' }) ])
      ]),
      el('div', { class:'rowbtns' }, [ editButton('birthday', b.id) ])
    ]);
  }

  var MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];

  function renderBirthdaysView(root){
    root.appendChild(el('h2', { class:'section-heading', text:'Födelsedagar' }));
    var list = state.birthdays.slice().sort(function(a,b){ return cmpISO(nextOccurrence(a), nextOccurrence(b)); });
    if (list.length === 0){
      root.appendChild(el('div', { class:'empty', text:'Inga födelsedagar tillagda än.' }));
    } else {
      list.forEach(function(b){
        var occ = nextOccurrence(b);
        var sub = b.day + ' ' + MONTHS[b.month - 1];
        if (b.year) sub += ' · fyller ' + (Number(occ.slice(0,4)) - b.year) + ' år';
        var d = fromISO(occ);
        var days = daysBetween(todayISO(), occ);
        var when = days === 0 ? 'idag' : (days === 1 ? 'imorgon' : 'om ' + days + ' dagar');
        if (isEditing('birthday', b.id)){
          root.appendChild(el('div', { style:'margin-bottom:8px;' }, [ renderBirthdayEditForm(b) ]));
          return;
        }
        root.appendChild(el('div', { class:'upcoming-row' }, [
          el('div', {}, [ el('div', { class:'title', text:'🎂 ' + b.name }), el('div', { class:'hint', text:sub + ' · ' + when }) ]),
          el('div', { class:'rowbtns' }, [
            editButton('birthday', b.id),
            el('button', { class:'del', 'aria-label':'Ta bort', onclick:function(){ deleteBirthday(b.id); } }, [document.createTextNode('✕')])
          ])
        ]));
      });
    }
    root.appendChild(el('div', { class:'hint', text:'Födelsedagar dyker upp i dagens lista och återkommer automatiskt varje år.' }));

    var box = el('div', { style:'margin-top:10px;' });
    if (!bAddOpen){
      box.appendChild(el('button', { class:'addtoggle', onclick:function(){ bAddOpen = true; render(); } }, [document.createTextNode('+ Lägg till födelsedag')]));
    } else {
      var nameInput = el('input', { type:'text', placeholder:'Namn', maxlength:'80' });
      var dayInput = el('input', { type:'number', min:'1', max:'31', placeholder:'Dag' });
      var monthSel = el('select', {}, MONTHS.map(function(m, i){ return el('option', { value:String(i+1), text:m }); }));
      var yearInput = el('input', { type:'number', min:'1900', max:'2100', placeholder:'t.ex. 1990' });
      box.appendChild(el('div', { class:'addform' }, [
        el('div', {}, [ el('label', { text:'Namn' }), nameInput ]),
        el('div', { class:'row' }, [
          el('div', {}, [ el('label', { text:'Dag' }), dayInput ]),
          el('div', {}, [ el('label', { text:'Månad' }), monthSel ])
        ]),
        el('div', {}, [ el('label', { text:'Födelseår (valfritt, för att visa ålder)' }), yearInput ]),
        el('div', { class:'actions' }, [
          el('button', { class:'btn ghost', onclick:function(){ bAddOpen = false; render(); } }, [document.createTextNode('Avbryt')]),
          el('button', { class:'btn primary', onclick:function(){
            var name = nameInput.value.trim();
            var day = parseInt(dayInput.value, 10);
            var month = parseInt(monthSel.value, 10);
            var year = yearInput.value ? parseInt(yearInput.value, 10) : null;
            if (!name){ nameInput.focus(); return; }
            if (!day || day < 1 || day > 31){ dayInput.focus(); return; }
            addBirthday(name, day, month, year);
          } }, [document.createTextNode('Lägg till')])
        ])
      ]));
    }
    root.appendChild(box);
  }

  function renderAddBox(container, defaultDate){
    if (!addOpen){
      container.appendChild(el('button', { class:'addtoggle', onclick:function(){ addOpen = true; render(); } }, [document.createTextNode('+ Lägg till uppgift')]));
      return;
    }
    var titleInput = el('input', { type:'text', placeholder:'t.ex. Handla mat', maxlength:'140' });
    var recSelect = el('select', {}, [
      el('option', { value:'once', text:'En gång' }),
      el('option', { value:'daily', text:'Varje dag' }),
      el('option', { value:'weekday', text:'Varje vardag' }),
      el('option', { value:'every2', text:'Varannan dag' }),
      el('option', { value:'every3', text:'Var tredje dag' })
    ]);
    var dateInput = el('input', { type:'date' });
    dateInput.value = defaultDate || todayISO();
    var dateLabel = el('label', { text:'Datum' });
    var dateWrap = el('div', {}, [ dateLabel, dateInput ]);
    function syncDateVisibility(){
      var needsDate = recSelect.value === 'once' || !!INTERVALS[recSelect.value];
      dateWrap.style.display = needsDate ? '' : 'none';
      dateLabel.textContent = recSelect.value === 'once' ? 'Datum' : 'Startdatum';
    }
    recSelect.addEventListener('change', syncDateVisibility); syncDateVisibility();
    var hint = el('div', { class:'hint', text:'Ett engångsdatum mer än en vecka fram hamnar under "Kommande" tills det närmar sig.' });
    var form = el('div', { class:'addform' }, [
      el('div', {}, [ el('label',{text:'Uppgift'}), titleInput ]),
      el('div', { class:'row' }, [ el('div',{},[el('label',{text:'Upprepning'}),recSelect]), dateWrap ]),
      hint,
      el('div', { class:'actions' }, [
        el('button', { class:'btn ghost', onclick:function(){ addOpen = false; render(); } }, [document.createTextNode('Avbryt')]),
        el('button', { class:'btn primary', onclick:function(){
          var title = titleInput.value.trim();
          if (!title) { titleInput.focus(); return; }
          var rec = recSelect.value;
          var date = (rec === 'once' || INTERVALS[rec]) ? (dateInput.value || todayISO()) : null;
          addTask(title, rec, date);
        } }, [document.createTextNode('Lägg till')])
      ])
    ]);
    container.appendChild(form);
  }

  function renderWeekView(root){
    renderDayPills(root);
    var d = fromISO(selectedDate);
    var heading = d.toLocaleDateString('sv-SE', { weekday:'long', day:'numeric', month:'long' });
    heading = heading.charAt(0).toUpperCase() + heading.slice(1);
    root.appendChild(el('h2', { class:'section-heading', text:heading }));
    var list = tasksForDate(selectedDate);
    var bdays = birthdaysForDate(selectedDate);
    if (list.length === 0 && bdays.length === 0){
      root.appendChild(el('div', { class:'empty', text:'Inga uppgifter den här dagen.' }));
    } else {
      var ul = el('ul', { class:'tasklist' });
      bdays.forEach(function(b){ ul.appendChild(renderBirthdayRow(b, selectedDate)); });
      list.forEach(function(t){ ul.appendChild(renderTaskRow(t, selectedDate)); });
      root.appendChild(ul);
    }
    renderAddBox(root, selectedDate);
  }

  function renderUpcomingView(root){
    root.appendChild(el('h2', { class:'section-heading', text:'Kommande (mer än en vecka fram)' }));
    var list = upcomingBacklog();
    if (list.length === 0){
      root.appendChild(el('div', { class:'empty', text:'Inga kommande uppgifter längre fram just nu.' }));
    } else {
      list.forEach(function(t){
        if (isEditing('task', t.id)){
          root.appendChild(el('div', { style:'margin-bottom:8px;' }, [ renderTaskEditForm(t) ]));
          return;
        }
        var d = fromISO(t.date);
        var dateStr = d.toLocaleDateString('sv-SE', { day:'numeric', month:'short' });
        root.appendChild(el('div', { class:'upcoming-row' }, [
          el('div', {}, [ el('div',{class:'title',text:t.title}) ]),
          el('div', { class:'rowbtns' }, [
            el('span',{class:'date',text:dateStr}),
            editButton('task', t.id),
            el('button',{class:'del','aria-label':'Ta bort',onclick:function(){ deleteTask(t.id); }},[document.createTextNode('✕')])
          ])
        ]));
      });
    }
    root.appendChild(el('div', { class:'hint', text:'De dyker automatiskt upp under "Den här veckan" när datumet är inom sju dagar.' }));
    var addRoot = el('div', {});
    renderAddBox(addRoot, addDays(lastWindowDate, 1));
    root.appendChild(addRoot);
  }

  function render(){
    app.innerHTML = '';
    var wrap = el('div', { class:'wrap' });
    var rangeLabel = (function(){
      var a = fromISO(weekDates[0]), b = fromISO(weekDates[weekDates.length-1]);
      var fmt = function(d){ return d.toLocaleDateString('sv-SE', { day:'numeric', month:'short' }); };
      return fmt(a) + '–' + fmt(b);
    })();
    wrap.appendChild(el('div', { class:'top' }, [
      el('h1',{text:'Mina uppgifter'}),
      el('div', { style:'display:flex;align-items:center;gap:10px;' }, [
        el('div',{class:'range',text:rangeLabel}),
        el('button', { class:'btn ghost', style:'padding:4px 8px;font-size:0.78rem;', onclick:function(){ sb.auth.signOut(); } }, [document.createTextNode('Logga ut')])
      ])
    ]));
    var tabs = el('div', { class:'tabs' }, [
      el('button', { class:'tab', 'aria-selected':String(view==='vecka'), onclick:function(){ view='vecka'; editing = null; render(); } }, [document.createTextNode('Den här veckan')]),
      el('button', { class:'tab', 'aria-selected':String(view==='kommande'), onclick:function(){ view='kommande'; editing = null; render(); } }, [document.createTextNode('Kommande')]),
      el('button', { class:'tab', 'aria-selected':String(view==='fodelsedagar'), onclick:function(){ view='fodelsedagar'; editing = null; render(); } }, [document.createTextNode('Födelsedagar')])
    ]);
    wrap.appendChild(tabs);
    if (view === 'vecka') renderWeekView(wrap);
    else if (view === 'kommande') renderUpcomingView(wrap);
    else renderBirthdaysView(wrap);
    app.appendChild(wrap);
  }

  function renderLogin(){
    app.innerHTML = '';
    var wrap = el('div', { class:'setup' });
    wrap.appendChild(el('h2', { text:'Logga in' }));
    var emailInput = el('input', { type:'email', placeholder:'E-post', style:'width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:0.94rem;margin-bottom:8px;' });
    var passInput = el('input', { type:'password', placeholder:'Lösenord', style:'width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:0.94rem;margin-bottom:12px;' });
    var errorBox = el('div', { style:'color:var(--danger);font-size:0.85rem;margin-bottom:8px;display:none;' });
    var submitBtn = el('button', { class:'btn primary', onclick: async function(){
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      var res = await sb.auth.signInWithPassword({ email: emailInput.value.trim(), password: passInput.value });
      submitBtn.disabled = false;
      if (res.error){ errorBox.textContent = res.error.message; errorBox.style.display = 'block'; return; }
    } }, [document.createTextNode('Logga in')]);
    wrap.appendChild(emailInput);
    wrap.appendChild(passInput);
    wrap.appendChild(errorBox);
    wrap.appendChild(submitBtn);
    app.appendChild(wrap);
  }

  sb.auth.onAuthStateChange(function(event, session){
    if (session && session.user){
      currentUser = session.user;
      app.innerHTML = '<div class="setup">Laddar…</div>';
      loadState();
    } else {
      currentUser = null;
      renderLogin();
    }
  });
})();
</script>
</body>
</html>
